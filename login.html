<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Customer Login & Register - Rewards Points Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth_glacier.css">
</head>
<body>
  <div class="mobile-device-shell">
    <!-- Status Bar -->
    <header class="mobile-status-bar">
      <span>9:41</span>
      <div class="notch-pill"></div>
      <div class="status-bar-icons">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="15" height="10" rx="2" ry="2"/><line x1="21" y1="11" x2="21" y2="13"/></svg>
      </div>
    </header>

    <!-- Notification Toast -->
    <div class="wf-toast" id="notification"></div>

    <main class="mobile-viewport">
      <!-- Brand Header -->
      <div class="auth-brand-section">
        <div class="auth-logo-wrap">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
          </svg>
        </div>
        <h1 class="auth-brand-title">Rewards Wallet</h1>
        <p class="auth-brand-subtitle">Collect points on purchases &amp; save money</p>
      </div>

      <!-- Segmented Tab Switcher (Login / Register) -->
      <div class="auth-tab-bar">
        <button type="button" class="auth-tab-btn active" id="tabBtnLogin" data-target="login">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span>Sign In</span>
        </button>
        <button type="button" class="auth-tab-btn" id="tabBtnRegister" data-target="register">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          <span>Create Account</span>
        </button>
      </div>

      <!-- TAB 1: LOGIN VIEW -->
      <section class="auth-view active" id="loginView">
        <form id="loginForm">
          <div class="auth-card">
            <div class="wf-form-group">
              <label class="wf-label" for="identifier">Mobile Phone Number *</label>
              <div class="input-with-prefix">
                <span class="phone-prefix-badge">+91</span>
                <input type="tel" id="identifier" name="username" inputmode="numeric" class="wf-input" placeholder="9876543210" value="9876543210" pattern="[0-9]{10}" maxlength="10" required>
              </div>
            </div>

            <div class="wf-form-group no-margin">
              <div class="label-row-split">
                <label class="wf-label" for="password">Password *</label>
              </div>
              <div class="input-with-action">
                <input type="password" id="password" name="password" autocomplete="current-password" class="wf-input" placeholder="••••••••" value="password123" required>
                <button type="button" class="btn-toggle-pass" data-for="password" title="Show / Hide Password">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
          </div>

          <button type="submit" id="btnSignIn" class="auth-btn-primary">
            <span>Sign In to Wallet</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>

        <button type="button" id="btnDemoLogin" class="auth-btn-demo">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Fill Demo Customer (Rahul: 9876543210)</span>
        </button>

        <div class="auth-switch-card">
          <p class="auth-switch-text">New to Rewards Wallet?</p>
          <button type="button" class="auth-switch-action-btn btn-switch-tab" data-target="register">
            <span>Create your account</span>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </section>

      <!-- TAB 2: REGISTER VIEW -->
      <section class="auth-view" id="registerView">
        <form id="registerForm">
          <div class="auth-card">
            <div class="wf-form-group">
              <label class="wf-label" for="regName">Full Customer Name *</label>
              <input type="text" id="regName" name="name" autocomplete="name" class="wf-input" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="wf-form-group">
              <label class="wf-label" for="regPhone">Mobile Phone (10 digits) *</label>
              <div class="input-with-prefix">
                <span class="phone-prefix-badge">+91</span>
                <input type="tel" id="regPhone" name="phone" inputmode="numeric" class="wf-input" placeholder="9876543210" pattern="[0-9]{10}" maxlength="10" required>
              </div>
              <small class="wf-meta">Points issued by shopkeepers link to this phone number</small>
            </div>

            <div class="wf-form-group no-margin">
              <label class="wf-label" for="regPassword">Set Password *</label>
              <div class="input-with-action">
                <input type="password" id="regPassword" name="password" autocomplete="new-password" class="wf-input" placeholder="••••••••" required>
                <button type="button" class="btn-toggle-pass" data-for="regPassword" title="Show / Hide Password">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
          </div>

          <button type="submit" id="btnRegister" class="auth-btn-primary">
            <span>Complete Registration</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </form>

        <div class="auth-switch-card">
          <p class="auth-switch-text">Already registered?</p>
          <button type="button" class="auth-switch-action-btn btn-switch-tab" data-target="login">
            <span>Sign In to existing wallet</span>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
