<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet UI Design Redesigns - 5 Modern Concepts for Rewards Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #0b0f19;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-gold: #f59e0b;
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    /* Top Showcase Header */
    .showcase-header {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.3) 100%);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 24px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-pill {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .title-area h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-area p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* 5 UI Selector Navigation */
    .design-nav-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .design-nav-bar::-webkit-scrollbar { display: none; }

    .design-pill-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .design-pill-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
    }

    .design-pill-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
    }

    .design-badge-num {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    /* Main Showcase Canvas */
    .showcase-content {
      max-width: 1240px;
      margin: 32px auto 0;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 410px 1fr;
      gap: 36px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .showcase-content {
        grid-template-columns: 1fr;
        justify-items: center;
      }
    }

    /* Mobile Frame Shell */
    .phone-container {
      position: sticky;
      top: 140px;
    }

    .iphone-frame {
      width: 380px;
      height: 780px;
      background: #000;
      border-radius: 48px;
      border: 8px solid #1e293b;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1), 0 0 40px rgba(99, 102, 241, 0.15);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .notch-bar {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 24px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notch-camera {
      width: 10px;
      height: 10px;
      background: #0f172a;
      border-radius: 50%;
      border: 1px solid #1e293b;
    }

    .phone-screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: #f8fafc;
      color: #0f172a;
      position: relative;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .phone-screen::-webkit-scrollbar { display: none; }

    /* Right Side Details & Strategy Panel */
    .strategy-card {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .concept-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      margin-bottom: 10px;
    }

    .concept-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: #fff;
    }

    .concept-summary {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .features-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: rgba(255, 255, 255, 0.03);
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .feature-icon-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .feature-info h4 {
      font-size: 0.92rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 2px;
    }

    .feature-info p {
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.45;
    }

    .code-preview-box {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      margin-top: 20px;
      position: relative;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.78rem;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
    }

    .code-block {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: #38bdf8;
      line-height: 1.5;
      overflow-x: auto;
      max-height: 160px;
    }

    /* ==============================================================
       THE 5 LIVE PHONE THEMES IMPLEMENTATIONS
       ============================================================== */

    /* Universal Mobile Internal Shell Elements */
    .mobile-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* -------------------------------------------------------------
       THEME 1: FINTECH LUXE & AURORA GLASS (Revolut / Apple Card)
       ------------------------------------------------------------- */
    .theme-1 {
      background: #0d1117;
      color: #ffffff;
      min-height: 100%;
      padding-bottom: 30px;
    }
    .theme-1 .mobile-status-row { color: #94a3b8; }
    
    .theme-1 .profile-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
    }
    .theme-1 .avatar-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .theme-1 .avatar-circle {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
    }
    .theme-1 .user-name {
      font-weight: 800;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-1 .verified-spark {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
    }
    .theme-1 .user-phone {
      font-size: 0.75rem;
      color: #64748b;
    }
    .theme-1 .exit-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Aurora Card */
    .theme-1 .aurora-card {
      margin: 12px 18px 20px;
      background: radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.8) 0%, rgba(15, 23, 42, 0.95) 90%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px -10px rgba(124, 58, 237, 0.35);
    }
    .theme-1 .aurora-glow-blob {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 130px;
      height: 130px;
      background: #06b6d4;
      filter: blur(40px);
      opacity: 0.4;
      pointer-events: none;
    }
    .theme-1 .aurora-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .theme-1 .aurora-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #cbd5e1;
      font-weight: 700;
    }
    .theme-1 .foil-badge {
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #451a03;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .theme-1 .aurora-balance-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 16px 0 12px;
    }
    .theme-1 .star-icon {
      color: #fbbf24;
      font-size: 1.6rem;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
    }
    .theme-1 .balance-digits {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #ffffff;
    }
    .theme-1 .aurora-pills {
      display: flex;
      gap: 8px;
    }
    .theme-1 .pill-luxe {
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .theme-1 .pill-active-luxe {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .theme-1 .pill-exp-luxe {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fb7185;
    }
    .theme-1 .action-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .theme-1 .action-chip {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 700;
      color: #e2e8f0;
      cursor: pointer;
    }
    .theme-1 .action-chip:hover { background: rgba(255, 255, 255, 0.16); }

    /* Segment Bar */
    .theme-1 .tabs-bar {
      display: flex;
      margin: 0 18px 16px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .theme-1 .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .theme-1 .tab-btn.active {
      background: #1e293b;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* List Items Glass */
    .theme-1 .card-item {
      margin: 0 18px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .theme-1 .card-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .theme-1 .card-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .theme-1 .thumb-square {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .theme-1 .card-content {
      flex: 1;
      margin-left: 12px;
    }
    .theme-1 .card-prod-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
    }
    .theme-1 .card-meta {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 2px;
    }
    .theme-1 .points-col {
      text-align: right;
    }
    .theme-1 .pts-gain {
      color: #34d399;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .theme-1 .exp-pill {
      font-size: 0.65rem;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 2px;
      display: inline-block;
    }

    /* -------------------------------------------------------------
       THEME 2: GAMIFIED QUEST & TIER REWARDS (Starbucks / Duolingo)
       ------------------------------------------------------------- */
    .theme-2 {
      background: #fdfbf7;
      color: #1e1b18;
      min-height: 100%;
      padding-bottom: 30px;
    }
    .theme-2 .mobile-status-row { color: #57534e; }
    
    .theme-2 .tier-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .theme-2 .level-chip {
      background: #fed7aa;
      color: #9a3412;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Gamified Hero Card */
    .theme-2 .game-hero {
      margin: 8px 18px 16px;
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      border-radius: 24px;
      padding: 22px;
      color: white;
      box-shadow: 0 12px 28px -6px rgba(234, 88, 12, 0.45);
      position: relative;
    }
    .theme-2 .streak-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .theme-2 .points-huge {
      font-size: 2.5rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0 14px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .theme-2 .coin-icon {
      background: #fde047;
      color: #78350f;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.15);
    }
    .theme-2 .progress-box {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 14px;
      padding: 12px;
    }
    .theme-2 .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffedd5;
    }
    .theme-2 .progress-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .theme-2 .progress-fill {
      width: 68%;
      height: 100%;
      background: #fde047;
      border-radius: 999px;
    }

    /* Milestone Row */
    .theme-2 .milestones-scroller {
      display: flex;
      gap: 10px;
      margin: 0 18px 18px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .theme-2 .milestone-card {
      background: white;
      border: 1px solid #e7e5e4;
      border-radius: 16px;
      padding: 10px 14px;
      min-width: 140px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .theme-2 .milestone-top {
      font-size: 0.68rem;
      font-weight: 800;
      color: #ea580c;
    }
    .theme-2 .milestone-reward {
      font-size: 0.82rem;
      font-weight: 700;
      color: #1c1917;
      margin: 2px 0;
    }
    .theme-2 .milestone-status {
      font-size: 0.65rem;
      color: #78716c;
    }

    /* Quest Items */
    .theme-2 .quest-card {
      background: white;
      margin: 0 18px 10px;
      border-radius: 18px;
      border: 2px solid #f5f5f4;
      padding: 14px;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.04);
      cursor: pointer;
    }
    .theme-2 .quest-badge {
      background: #ffedd5;
      color: #c2410c;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* -------------------------------------------------------------
       THEME 3: MINIMALIST SWISS & CLEAN PRECISION (Linear / Apple)
       ------------------------------------------------------------- */
    .theme-3 {
      background: #ffffff;
      color: #0f172a;
      min-height: 100%;
      padding-bottom: 30px;
    }
    .theme-3 .mobile-status-row { color: #0f172a; }
    
    .theme-3 .minimal-header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
    }
    .theme-3 .minimal-title {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .theme-3 .clean-hero {
      padding: 24px 20px 20px;
      border-bottom: 1px solid #f1f5f9;
    }
    .theme-3 .clean-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 600;
    }
    .theme-3 .clean-balance {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 6px 0 10px;
      color: #09090b;
      font-family: 'Space Grotesk', sans-serif;
    }
    .theme-3 .clean-pills {
      display: flex;
      gap: 12px;
    }
    .theme-3 .clean-stat-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #475569;
    }
    .theme-3 .dot-active {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #059669;
    }
    .theme-3 .dot-exp {
      width: 7px;
      height: 7px;
