<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel White Theme Rewards Wallet - 10 Fresh UI Designs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-subtle: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -4px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f1f5f9;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    /* Top Showcase Bar */
    .top-bar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
    }

    .top-container {
      max-width: 1260px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pastel-badge {
      background: linear-gradient(135deg, #fbcfe8, #c4b5fd);
      color: #701a75;
      font-weight: 800;
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(196, 181, 253, 0.4);
    }

    .title-h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .title-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-action {
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
    }
    .btn-action.active-toggle {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* 10 Pastel Tabs Scroller */
    .palette-scroller {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 6px;
      scrollbar-width: thin;
    }

    .tab-pill {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      color: #475569;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.18s ease;
      box-shadow: var(--shadow-sm);
    }

    .tab-pill:hover {
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .tab-pill.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
    }

    .color-swatch-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
    }

    /* Main Showcase Stage */
    .stage-container {
      max-width: 1260px;
      margin: 32px auto 0;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 410px 1fr;
      gap: 36px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .stage-container {
        grid-template-columns: 1fr;
        justify-items: center;
      }
    }

    /* Phone Shell (White / Light Minimalist Bezel) */
    .phone-box {
      position: sticky;
      top: 140px;
    }

    .iphone-light {
      width: 380px;
      height: 780px;
      background: #ffffff;
      border-radius: 46px;
      border: 10px solid #e2e8f0;
      box-shadow: 0 25px 60px -12px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .notch-white {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 105px;
      height: 22px;
      background: #e2e8f0;
      border-radius: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notch-dot {
      width: 8px;
      height: 8px;
      background: #cbd5e1;
      border-radius: 50%;
    }

    .phone-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      scrollbar-width: none;
    }
    .phone-body::-webkit-scrollbar { display: none; }

    /* Right Details & Specs Card */
    .specs-card {
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid var(--border-subtle);
      padding: 32px;
      box-shadow: var(--shadow-md);
    }

    .concept-chip {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .concept-heading {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .concept-desc {
      color: #64748b;
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .swatches-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 12px 16px;
      background: #f8fafc;
      border-radius: 14px;
      border: 1px solid #f1f5f9;
    }
    .swatch-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .swatch-circle {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .swatch-label {
      font-size: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
      font-weight: 600;
    }

    .perks-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 26px;
    }

    .perk-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #fafafa;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
    }
    .perk-icon-sq {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .perk-text h4 {
      font-size: 0.88rem;
      font-weight: 700;
      color: #0f172a;
    }
    .perk-text p {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 2px;
      line-height: 1.45;
    }

    .code-box {
      background: #0f172a;
      border-radius: 14px;
      padding: 16px;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.5;
      overflow-x: auto;
    }

    /* Comparison Grid */
    .grid-view-wrap {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 24px;
      max-width: 1260px;
      margin: 32px auto;
      padding: 0 24px;
    }
    .is-grid-mode .stage-container { display: none; }
    .is-grid-mode .grid-view-wrap { display: grid; }

    .grid-card-preview {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .grid-card-preview:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 30px -8px rgba(15, 23, 42, 0.12);
      border-color: #cbd5e1;
    }

    /* Common In-Phone Mobile Components */
    .m-status {
      display: flex;
      justify-content: space-between;
      padding: 12px 18px 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #475569;
    }
    .m-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px 10px;
    }
    .m-user-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .m-avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
    }
    .m-name {
      font-weight: 800;
      font-size: 0.95rem;
      color: #0f172a;
    }
    .m-phone {
      font-size: 0.7rem;
      color: #64748b;
    }
    .m-exit-btn {
      background: #f1f5f9;
      border: none;
      color: #475569;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Drawer expandable */
    .m-item-card {
      margin: 0 16px 10px;
      background: #ffffff;
      border-radius: 16px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .m-drawer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0;
      font-size: 0.7rem;
    }
    .m-item-card.is-expanded .m-drawer {
      max-height: 160px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0,0,0,0.08);
    }
    .m-d-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      color: #64748b;
    }
    .m-d-val {
      font-weight: 700;
      color: #0f172a;
    }
  </style>
</head>

      const theme = PASTEL_THEMES.find(t => t.id === id);

      document.querySelectorAll('.tab-pill').forEach(btn => {

      });

      document.getElementById('phoneBody').innerHTML = theme.renderPhone();

      // Render Specs Panel
      document.getElementById('specsPanel').innerHTML = `
        <span class="concept-chip" style="background: ${theme.swatches[1]}; color: ${theme.accent};">${theme.styleTag}</span>

              <div class="swatch-item">

    function renderGridView() {
      const wrap = document.getElementById('gridViewWrap');
      wrap.innerHTML = PASTEL_THEMES.map(t => `

      document.body.classList.remove('is-grid-mode');
