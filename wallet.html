<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Customer Wallet - Rewards Points collection for customers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* -------------------------------------------------------------
       PASTEL GLACIER BLUE DESIGN SYSTEM (Nordic Powder Blue & Pure White)
       ------------------------------------------------------------- */
    :root {
      --bg-page: #f2f7fb;
      --bg-white: #ffffff;
      
      /* Nordic Pastel Glacier Palette */
      --glacier-50: #f6fafd;
      --glacier-100: #eaf3fa;
      --glacier-150: #deedfa;
      --glacier-200: #cfe3f6;
      --glacier-300: #b5d5f0;
      --glacier-400: #98b9d6; /* Reference swatch base */
      --glacier-500: #7ba6cb;
      --glacier-600: #5587b1;
      --glacier-700: #3c6d96;
      --glacier-800: #265074;
      --glacier-900: #163654;
      --glacier-950: #0d2238;

      /* Typography Contrast */
      --text-main: #0d2238;
      --text-body: #1c3d5d;
      --text-muted: #5a7b99;
      --text-faint: #8da6be;

      /* Accents */
      --emerald-accent: #059669;
      --emerald-bg: #ecfdf5;
      --emerald-border: #a7f3d0;
      --rose-accent: #e11d48;
      --rose-bg: #fff1f2;

      --shadow-soft: 0 4px 20px -2px rgba(85, 135, 177, 0.06);
      --shadow-card: 0 8px 24px -4px rgba(85, 135, 177, 0.09);
      --shadow-hover: 0 12px 30px -4px rgba(85, 135, 177, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #f7fafe 0%, #edf4fa 50%, #e2edf6 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Soft Contour Glow Behind Phone */
    body::before {
      content: '';
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(181, 213, 240, 0.6) 0%, rgba(234, 243, 250, 0) 70%);
      filter: blur(55px);
      z-index: -1;
      pointer-events: none;
    }

    /* Mobile Device Shell */
    .mobile-device-shell {
      width: 100%;
      max-width: 416px;
      min-height: 780px;
      background: #ffffff;
      border-radius: 44px;
      box-shadow: 0 25px 65px -15px rgba(22, 54, 84, 0.16), 0 0 0 1px rgba(207, 227, 246, 0.9);
      border: 8px solid #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Top Floating Navigation */
    .floating-switcher {
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .switch-link {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--glacier-200);
      color: var(--glacier-900);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(85, 135, 177, 0.08);
      transition: all 0.2s ease;
    }
    .switch-link:hover {
      background: #ffffff;
      border-color: var(--glacier-400);
      transform: translateY(-1px);
    }

    /* Status Bar */
    .mobile-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px 6px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--glacier-900);
      background: #ffffff;
      position: relative;
      z-index: 10;
    }

    .notch-pill {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 22px;
      background: var(--glacier-100);
      border-radius: 20px;
      border: 1px solid var(--glacier-200);
      pointer-events: none;
    }

    .status-bar-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--glacier-800);
    }

    .header-pill {
      background: var(--glacier-100);
      color: var(--glacier-800);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--glacier-200);
    }

    /* Header Profile Strip */
    .mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 14px;
      background: #ffffff;
      border-bottom: 1px solid var(--glacier-100);
    }

    .wallet-header-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wallet-avatar-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #eaf3fa 0%, #cfe3f6 100%);
      border: 1.5px solid var(--glacier-300);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 12px rgba(85, 135, 177, 0.12);
    }

    .wallet-avatar-initial {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--glacier-800);
    }

    .wallet-avatar-online {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 11px;
      height: 11px;
      background: var(--emerald-accent);
      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    .wallet-header-info {
      display: flex;
      flex-direction: column;
    }

    .wallet-user-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wallet-user-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--glacier-950);
      letter-spacing: -0.01em;
    }

    .user-verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--emerald-bg);
      color: var(--emerald-accent);
      border: 1px solid var(--emerald-border);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
    }

    .wallet-user-phone {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .wallet-exit-pill-btn {
      background: var(--glacier-100);
      border: 1px solid var(--glacier-200);
      color: var(--glacier-800);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .wallet-exit-pill-btn:hover {
      background: var(--glacier-200);
      color: var(--glacier-950);
    }

    /* Main Scrollable Viewport */
    .mobile-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 18px 30px;
      background: #ffffff;
      scroll-behavior: smooth;
    }

    /* HERO BALANCE BOX (Pastel Glacier Blue - Fully Centered) */
    .wallet-hero-box {
      background: linear-gradient(135deg, #F0F6FC 0%, #E3EFFB 50%, #CDE4F7 100%);
      border: 1.5px solid var(--glacier-200);
      border-radius: 26px;
      padding: 24px 20px 22px;
      box-shadow: 0 12px 30px -6px rgba(85, 135, 177, 0.1);
      position: relative;
      margin-bottom: 20px;
      overflow: hidden;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Subtle Glacier Contour Glow */
    .wallet-hero-box::after {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-title-label {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--glacier-800);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: block;
      text-align: center;
      width: 100%;
    }

    .wallet-hero-points {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 14px;
      width: 100%;
    }

    #totalPoints {
      font-size: 2.85rem;
      font-weight: 900;
      color: var(--glacier-950);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .wallet-pills-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .hero-pill-dark {
      background: #ffffff;
      border: 1px solid var(--glacier-200);
      padding: 5px 12px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .pill-active {
      color: var(--emerald-accent);
    }
    .glow-dot-emerald {
      width: 7px;
      height: 7px;
      background: var(--emerald-accent);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    /* SEGMENTED SWITCHER (Gained vs Applied) */
    .wallet-segment-bar {
      display: flex;
      background: var(--glacier-100);
      border: 1.5px solid var(--glacier-200);
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 18px;
    }

    .wallet-segment-btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 12px;
      border: none;
      background: transparent;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--glacier-700);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .wallet-segment-btn.active {
      background: #ffffff;
      color: var(--glacier-950);
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(85, 135, 177, 0.12);
    }

    .segment-badge {
      background: var(--glacier-200);
      color: var(--glacier-900);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .wallet-segment-btn.active .segment-badge {
      background: var(--glacier-100);
      color: var(--glacier-800);
    }

    /* REWARD CARDS (Pastel Glacier Collapsible Architecture) */
    .reward-card {
      background: #ffffff;
      border: 1.5px solid var(--glacier-100);
      border-radius: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .reward-card:hover {
      border-color: var(--glacier-200);
      box-shadow: var(--shadow-card);
    }
    .reward-card.is-expanded {
      border-color: var(--glacier-300);
      box-shadow: var(--shadow-hover);
    }

    .reward-card-header-btn {
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }

    .reward-card-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .thumb-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--glacier-100);
      border: 1px solid var(--glacier-200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reward-card-info {
      flex: 1;
      min-width: 0;
    }

    .reward-card-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--glacier-950);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reward-card-subrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .reward-pts-grant {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--emerald-accent);
    }
    .reward-pts-grant.is-expired-pts {
      color: var(--text-faint);
      text-decoration: line-through;
    }

    .card-pill-mini {
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
    }
    .card-pill-mini.pill-active {
      background: var(--glacier-100);
      color: var(--glacier-800);
      border: 1px solid var(--glacier-200);
    }
    .card-pill-mini.pill-expiring-soon {
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fed7aa;
      font-weight: 800;
    }
    .card-pill-mini.pill-expired {
      background: var(--rose-bg);
      color: var(--rose-accent);
      border: 1px solid #fecdd3;
    }

    .card-date-text {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .pill-order-ref {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 700;
      background: var(--glacier-100);
      color: var(--glacier-900);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Circular Smooth Chevron Button */
    .reward-card-chevron-box {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--glacier-100);
      border: 1px solid var(--glacier-200);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--glacier-700);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s ease;
      flex-shrink: 0;
    }
    .reward-card.is-expanded .reward-card-chevron-box {
      transform: rotate(180deg);
      background: var(--glacier-200);
      color: var(--glacier-950);
    }
    .reward-card-chevron-box svg {
      width: 15px;
      height: 15px;
      display: block;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    /* Expandable Drawer (100% hidden when collapsed - zero leakage) */
    .reward-card-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      visibility: hidden;
    }
    .reward-card.is-expanded .reward-card-drawer {
      grid-template-rows: 1fr;
      visibility: visible;
    }
    .reward-card:not(.is-expanded) .reward-card-drawer {
      display: none !important;
    }
    .reward-drawer-inner {
      min-height: 0;
      padding: 0 16px 16px;
      opacity: 0;
      transition: opacity 0.22s ease 0.05s;
    }
    .reward-card.is-expanded .reward-drawer-inner {
      opacity: 1;
    }

    /* Breakdown Details Card */
    .reward-breakdown-card {
      background: linear-gradient(135deg, #f8fbfd 0%, #eef5fa 100%);
      border: 1.5px solid var(--glacier-200);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 10px rgba(85, 135, 177, 0.04);
    }

    .breakdown-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--glacier-200);
    }
    .breakdown-card-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--glacier-900);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .breakdown-status-badge {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .breakdown-status-badge.is-active {
      background: var(--emerald-bg);
      color: var(--emerald-accent);
      border: 1px solid var(--emerald-border);
    }
    .breakdown-status-badge.is-expiring-soon {
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fed7aa;
    }
    .breakdown-status-badge.is-expired {
      background: var(--rose-bg);
      color: var(--rose-accent);
      border: 1px solid #fecdd3;
    }
    .breakdown-status-badge.is-applied {
      background: var(--glacier-100);
      color: var(--glacier-800);
      border: 1px solid var(--glacier-200);
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
    }
    .breakdown-label {
      color: var(--text-muted);
      font-weight: 600;
    }
    .breakdown-val {
      color: var(--glacier-950);
      font-weight: 700;
    }
    .val-order-code {
      font-family: 'JetBrains Mono', monospace;
      color: var(--glacier-800);
    }
    .breakdown-bold {
      font-weight: 800;
      color: var(--glacier-950);
    }
    .badge-reward-rate {
      background: var(--glacier-100);
      color: var(--glacier-800);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.68rem;
    }
    .font-valid { color: var(--emerald-accent); }
    .font-expiring-soon { color: #c2410c; font-weight: 800; }
    .font-expired { color: var(--rose-accent); }
    .font-redeemed-pts { color: var(--glacier-700); font-weight: 800; }
    .breakdown-due-amount { color: var(--glacier-950); font-weight: 800; font-size: 0.85rem; }

    /* Empty State */
    .empty-wallet-card {
      text-align: center;
      padding: 36px 20px;
      border: 2px dashed var(--glacier-200);
      border-radius: 20px;
      background: var(--glacier-50);
      margin-top: 10px;
    }
    .empty-wallet-card strong {
      display: block;
      font-size: 0.9rem;
      color: var(--glacier-900);
      margin-bottom: 4px;
    }
    .empty-wallet-card p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .u-hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Mobile Device Shell with Complete Wallet Components -->
  <div class="mobile-device-shell">
    
    <!-- Status Bar -->
    <header class="mobile-status-bar">
      <span>9:41</span>
      <div class="notch-pill"></div>
      <div class="status-bar-icons">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="15" height="10" rx="2" ry="2"/><line x1="21" y1="11" x2="21" y2="13"/></svg>
      </div>
    </header>

    <!-- Header with Profile, Verification & Exit -->
    <div class="mobile-header">
      <div class="wallet-header-profile">
        <div class="wallet-avatar-box">
          <span class="wallet-avatar-initial" id="userAvatarInitial">H</span>
          <span class="wallet-avatar-online"></span>
        </div>
        <div class="wallet-header-info">
          <div class="wallet-user-row">
            <strong id="customerName" class="wallet-user-name">Harish</strong>
            <span class="user-verified-badge">
              <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Verified
            </span>
          </div>
          <small id="customerPhone" class="wallet-user-phone">+91 4353535353</small>
        </div>
      </div>
      <div class="wallet-nav-buttons">
        <button class="wallet-exit-pill-btn" id="btnLogout" type="button">
          <span>Exit</span>
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Scrollable Viewport -->
    <main class="mobile-viewport">
      
      <!-- Hero Points Balance Box (Centered, No Star Icon) -->
      <div class="wallet-hero-box">
        <span class="hero-title-label">TOTAL AVAILABLE REWARD POINTS</span>
        <div class="wallet-hero-points">
          <span id="totalPoints">0</span>
        </div>
        <div class="wallet-pills-row">
          <span class="hero-pill-dark pill-active">
            <span class="glow-dot-emerald"></span>
            <span id="activeCount">0 ACTIVE</span>
          </span>
        </div>
      </div>

      <!-- Segmented View Switcher: Gained vs Applied Lists -->
      <div class="wallet-segment-bar">
        <button type="button" class="wallet-segment-btn active" id="tabGainedRewards">
          <span>Gained Rewards</span>
          <span class="segment-badge" id="gainedCountBadge">0</span>
        </button>
        <button type="button" class="wallet-segment-btn" id="tabAppliedRewards">
          <span>Applied on Products</span>
          <span class="segment-badge" id="appliedCountBadge">0</span>
        </button>
      </div>

      <!-- LIST SCREEN 1: GAINED REWARDS (Collapsible View with Points & Expiry) -->
      <section id="viewGainedRewards" class="wallet-view-section">
        <div id="rewardsListContainer"></div>
        <div id="emptyGainedState" class="empty-wallet-card u-hidden">
          <strong>No Rewards in Wallet</strong>
          <p>Earned rewards from orders will appear here.</p>
        </div>
      </section>

      <!-- LIST SCREEN 2: APPLIED REWARDS ON PRODUCTS (Separate View) -->
      <section id="viewAppliedRewards" class="wallet-view-section u-hidden">
        <div style="font-size: 0.78rem; font-weight: 800; color: var(--glacier-900); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.04em;">
          Applied Rewards on Products
        </div>
        <div id="appliedRewardsListContainer"></div>
        <div id="emptyAppliedState" class="empty-wallet-card u-hidden">
          <strong>No Applied Rewards Yet</strong>
          <p>Rewards redeemed against purchases will appear here.</p>
        </div>
      </section>

    </main>
  </div>

  <!-- DB and Controller scripts -->
  <script src="js/db.js"></script>
  <script>
    /**
     * Customer Mobile Wallet Controller - Pastel Glacier Blue Edition
     */
    document.addEventListener('DOMContentLoaded', async () => {
      const customerNameEl = document.getElementById('customerName');
      const customerPhoneEl = document.getElementById('customerPhone');
      const totalPointsEl = document.getElementById('totalPoints');
      const activeCountEl = document.getElementById('activeCount');
      const rewardsListContainer = document.getElementById('rewardsListContainer');
      const appliedRewardsListContainer = document.getElementById('appliedRewardsListContainer');
      const emptyGainedState = document.getElementById('emptyGainedState');
      const emptyAppliedState = document.getElementById('emptyAppliedState');
      const gainedBadge = document.getElementById('gainedCountBadge');
      const appliedBadge = document.getElementById('appliedCountBadge');
      const btnLogout = document.getElementById('btnLogout');

      const tabGained = document.getElementById('tabGainedRewards');
      const tabApplied = document.getElementById('tabAppliedRewards');
      const viewGained = document.getElementById('viewGainedRewards');
      const viewApplied = document.getElementById('viewAppliedRewards');

      // Check current user or load Harish demo user
      let currentUser = null;
      if (window.rewardsDB && typeof window.rewardsDB.getCurrentUser === 'function') {
        currentUser = window.rewardsDB.getCurrentUser();
      }

      if (!currentUser) {
        currentUser = {
          name: 'Harish',
          phone: '4353535353'
        };
      }

      customerNameEl.textContent = currentUser.name || 'Harish';
      customerPhoneEl.textContent = `+91 ${currentUser.phone}`;

      const avatarEl = document.getElementById('userAvatarInitial');
      if (avatarEl) {
        const rawName = (currentUser.name || 'H').trim();
        avatarEl.textContent = rawName.charAt(0).toUpperCase();
      }

      if (btnLogout) {
        btnLogout.addEventListener('click', (e) => {
          e.preventDefault();
          if (window.rewardsDB && typeof window.rewardsDB.logoutUser === 'function') {
            window.rewardsDB.logoutUser();
          }
          window.location.href = 'login.html';
        });
      }

      // Segment Switcher
      function switchWalletView(isApplied) {
        tabGained.classList.toggle('active', !isApplied);
        tabApplied.classList.toggle('active', isApplied);
        viewGained.classList.toggle('u-hidden', isApplied);
        viewApplied.classList.toggle('u-hidden', !isApplied);
      }

      tabGained.addEventListener('click', () => switchWalletView(false));
      tabApplied.addEventListener('click', () => switchWalletView(true));

      // Toggle Collapsible Card
      function toggleCard(card, container) {
        const isExpanded = card.classList.contains('is-expanded');
        container.querySelectorAll('.reward-card.is-expanded').forEach(c => {
          c.classList.remove('is-expanded');
          const h = c.querySelector('.reward-card-header-btn');
          if (h) h.setAttribute('aria-expanded', 'false');
        });
        if (!isExpanded) {
          card.classList.add('is-expanded');
          const h = card.querySelector('.reward-card-header-btn');
          if (h) h.setAttribute('aria-expanded', 'true');
        }
      }

      // Render 1: Gained Rewards (ONLY show available unspent rewards, never used or empty)
      function renderGainedRewards(rewards) {
        rewardsListContainer.innerHTML = '';
        const now = new Date();
        let totalActivePoints = 0, activeCount = 0;

        // ONLY keep available cards (points > 0, not used, not expired)
        const availableRewards = (rewards || []).filter(r => {
          const pts = Number(r.rewardPoints) || 0;
          const isExp = r.expiryDate ? new Date(r.expiryDate) < now : false;
          return pts > 0 && r.status !== 'USED' && !isExp;
        });

        if (availableRewards.length === 0) {
          emptyGainedState.classList.remove('u-hidden');
          totalPointsEl.textContent = '0';
          activeCountEl.textContent = '0 ACTIVE';
          if (gainedBadge) gainedBadge.textContent = '0';
          return { totalActivePoints: 0 };
        }

        emptyGainedState.classList.add('u-hidden');
        if (gainedBadge) gainedBadge.textContent = availableRewards.length;

        // Sort rewards in priority queue: Near expiration on top!
        const queueSortedRewards = [...availableRewards].sort((a, b) => {
          const timeA = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
          const timeB = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;
          if (timeA !== timeB) return timeA - timeB;
          return new Date(b.orderDate || b.createdAt || 0) - new Date(a.orderDate || a.createdAt || 0);
        });

        queueSortedRewards.forEach(r => {
          const pts = Number(r.rewardPoints) || 0;
          totalActivePoints += pts;
          activeCount++;

          let miniExp = 'No Expiry';
          let isNearExpiry = false;
          let diffDays = null;

          if (r.expiryDate) {
            const expD = new Date(r.expiryDate);
            const dateStr = expD.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            const diffMs = expD.getTime() - now.getTime();
            diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
            if (diffDays <= 30) {
              isNearExpiry = true;
              if (diffDays <= 0 || diffDays === 1) {
                miniExp = '⏱️ Exp: Today';
              } else if (diffDays <= 7) {
                miniExp = `⏱️ Exp in ${diffDays}d`;
              } else {
                miniExp = `Exp: ${expD.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })} (${diffDays}d)`;
              }
            } else {
              miniExp = `Exp: ${dateStr}`;
            }
          }

          const expPillClass = isNearExpiry ? 'pill-expiring-soon' : 'pill-active';

          let expFullStr = 'No Expiry';
          if (r.expiryDate) {
            const expD = new Date(r.expiryDate);
            expFullStr = expD.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
          }

          let orderDateStr = '';
          if (r.orderDate) {
            const ordD = new Date(r.orderDate);
            if (!isNaN(ordD.getTime())) {
              orderDateStr = ordD.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            } else {
              orderDateStr = r.orderDate;
            }
          }

          const card = document.createElement('div');
          card.className = `reward-card ${isNearExpiry ? 'is-near-expiry' : ''}`;
          card.innerHTML = `
            <div class="reward-card-header-btn" role="button" tabindex="0" aria-expanded="false">
              <div class="reward-card-item">
                <div class="thumb-box">${r.productImage ? `<img src="${r.productImage}" alt="${r.productName || ''}" />` : '🎁'}</div>
                <div class="reward-card-info">
                  <div class="reward-card-title">${r.productName || 'Order Reward'}</div>
                  <div class="reward-card-subrow">
                    <span class="reward-pts-grant">+${pts.toLocaleString()} PTS</span>
                    <span class="card-pill-mini ${expPillClass}">${miniExp}</span>
                  </div>
                </div>
                <div class="reward-card-chevron-box">
                  <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
              </div>
            </div>

            <div class="reward-card-drawer">
              <div class="reward-drawer-inner">
                <div class="reward-breakdown-card">
                  <div class="breakdown-card-top">
                    <span class="breakdown-card-title">Reward Details</span>
                    <span class="breakdown-status-badge ${isNearExpiry ? 'is-expiring-soon' : 'is-active'}">
                      ${isNearExpiry ? 'Expiring Soon' : 'Verified Order'}
                    </span>
                  </div>
                  <div class="breakdown-row">
                    <span class="breakdown-label">Order ID</span>
                    <span class="breakdown-val"><code class="val-order-code">#${r.orderId || 'N/A'}</code></span>
                  </div>
                  <div class="breakdown-row">
                    <span class="breakdown-label">Order Total</span>
                    <span class="breakdown-val breakdown-bold">₹${Number(r.orderAmount || 0).toLocaleString()}</span>
                  </div>
                  <div class="breakdown-row">
                    <span class="breakdown-label">Reward Rate</span>
                    <span class="breakdown-val"><span class="badge-reward-rate">${r.rewardPercent || 10}% Earned</span></span>
                  </div>
                  ${orderDateStr ? `
                  <div class="breakdown-row">
                    <span class="breakdown-label">Order Date</span>
                    <span class="breakdown-val">${orderDateStr}</span>
                  </div>` : ''}
                  <div class="breakdown-row">
                    <span class="breakdown-label">Valid Until</span>
                    <span class="breakdown-val ${isNearExpiry ? 'font-expiring-soon' : 'font-valid'}">
                      ${expFullStr}${diffDays !== null && diffDays <= 30 ? ` (in ${diffDays}d)` : ''}
                    </span>
                  </div>
                </div>
              </div>
            </div>`;

          card.querySelector('.reward-card-header-btn').addEventListener('click', () => toggleCard(card, rewardsListContainer));
          rewardsListContainer.appendChild(card);
        });

        totalPointsEl.textContent = totalActivePoints.toLocaleString();
        activeCountEl.textContent = `${activeCount} ACTIVE`;
        return { totalActivePoints };
      }

      // Render 2: Applied Rewards on Products
      function renderAppliedRewards(appliedList) {
        appliedRewardsListContainer.innerHTML = '';
        if (!appliedList || appliedList.length === 0) {
          emptyAppliedState.classList.remove('u-hidden');
          if (appliedBadge) appliedBadge.textContent = '0';
          return;
        }

        emptyAppliedState.classList.add('u-hidden');
        if (appliedBadge) appliedBadge.textContent = appliedList.length;

        appliedList.forEach(a => {
          const orderRef = (a.orderId && a.orderId !== 'N/A' && a.orderId.trim()) ? a.orderId : ('ORD-' + (a.id || 101));
          const card = document.createElement('div');
          card.className = 'reward-card';
          card.innerHTML = `
            <div class="reward-card-header-btn" role="button" tabindex="0" aria-expanded="false">
              <div class="reward-card-item">
                <div class="thumb-box">
                  ${a.productImage ? `<img src="${a.productImage}" alt="" />` : `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#3c6d96" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`}
                </div>
                <div class="reward-card-info">
                  <div class="reward-card-title">${a.productName}</div>
                  <div class="reward-card-subrow">
                    <span class="card-date-text">${a.date || '2026-11-16'}</span>
                    <span class="pill-order-ref">#${orderRef}</span>
                  </div>
                </div>
                <div class="reward-card-chevron-box">
                  <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
              </div>
            </div>

            <div class="reward-card-drawer">
              <div class="reward-drawer-inner">
                <div class="reward-breakdown-card">
                  <div class="breakdown-card-top">
                    <span class="breakdown-card-title">Redemption Details</span>
                    <span class="breakdown-status-badge is-applied">Applied</span>
                  </div>
                  <div class="breakdown-row">
                    <span class="breakdown-label">Product Price</span>
                    <span class="breakdown-val breakdown-bold">₹${Number(a.productPrice || 0).toLocaleString()}</span>
                  </div>
                  <div class="breakdown-row">
                    <span class="breakdown-label">Rewards Applied</span>
                    <span class="breakdown-val font-redeemed-pts">-${Number(a.pointsApplied || 0).toLocaleString()} PTS</span>
                  </div>
                  <div class="breakdown-row">
                    <span class="breakdown-label">Paid to Shopkeeper</span>
                    <span class="breakdown-val breakdown-due-amount">₹${Number(a.dueAmount || 0).toLocaleString()}</span>
                  </div>
                  <div class="breakdown-row">
                    <span class="breakdown-label">Order Reference</span>
                    <span class="breakdown-val"><code class="val-order-code">#${orderRef}</code></span>
                  </div>
                </div>
              </div>
            </div>`;

          card.querySelector('.reward-card-header-btn').addEventListener('click', () => toggleCard(card, appliedRewardsListContainer));
          appliedRewardsListContainer.appendChild(card);
        });
      }

      // Load Data
      async function loadWallet() {
        let rewards = [];
        let applied = [];

        try {
          if (window.rewardsDB && currentUser.phone) {
            rewards = await window.rewardsDB.getRewardsByPhone(currentUser.phone);
            applied = await window.rewardsDB.getAppliedRewardsByPhone(currentUser.phone);
          }
        } catch(e) {
          console.warn('DB lookup error:', e);
        }

        if (!rewards || rewards.length === 0) {
          rewards = [
            {
              id: 101,
              productName: 'Sony Bravia 55" Smart Google TV 4K',
              rewardPoints: 4500,
              orderAmount: 45000,
              rewardPercent: 10,
              orderId: 'ORD-8942',
              orderDate: '2026-11-15',
              expiryDate: '2026-11-28',
              productImage: 'assets/smart_google_tv.jpg'
            },
            {
              id: 102,
              productName: 'Cetaphil Gentle Skin Cleanser',
              rewardPoints: 120,
              orderAmount: 1200,
              rewardPercent: 10,
              orderId: 'ORD-7719',
              orderDate: '2026-11-10',
              expiryDate: '2026-12-15',
              productImage: ''
            },
            {
              id: 103,
              productName: 'Sony WH-1000XM5 Headphones',
              rewardPoints: 1200,
              orderAmount: 24000,
              rewardPercent: 10,
              orderId: 'ORD-6621',
              orderDate: '2026-11-04',
              expiryDate: '2027-11-04',
              productImage: ''
            }
          ];
        }

        if (!applied || applied.length === 0) {
          applied = [
            {
              id: 201,
              productName: 'Sony Bravia 55" Smart Google TV 4K',
              productPrice: 42000,
              pointsApplied: 4200,
              dueAmount: 37800,
              orderId: 'ORD-4401',
              date: '2026-11-16',
              productImage: 'assets/smart_google_tv.jpg'
            }
          ];
        }

        renderGainedRewards(rewards);
        renderAppliedRewards(applied);
      }

      await loadWallet();
    });
  </script>
</body>
</html>
